name: Daily RouteZero Maintenance

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintenance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          python -m pip install -e .
          python -m pytest

      - name: Update maintenance log
        run: |
          echo "Last successful maintenance: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > maintenance-status.txt

      - name: Commit maintenance result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maintenance-status.txt
          git diff --cached --quiet || git commit -m "chore: daily maintenance"
          git push